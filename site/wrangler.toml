# Hideout's website: static files only (public/), served at hideout.meshtool.ai.
# No worker script, no cookies, no analytics. The workers.dev and preview addresses are off,
# so the custom domain is the only way in.
name = "hideout-site"
compatibility_date = "2026-09-01"
workers_dev = false
preview_urls = false
routes = [
  { pattern = "hideout.meshtool.ai", custom_domain = true }
]

[assets]
directory = "./public"
not_found_handling = "404-page"
